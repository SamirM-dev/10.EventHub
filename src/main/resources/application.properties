spring.application.name=eventhub

logging.level.com.example=DEBUG
logging.level.root=INFO
logging.file.name=logs/app.logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %mdc{keyName} %thread %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %mdc{keyName} %thread %-5level %logger{36} - %msg%n

management.endpoint.health.show-details=always

jwt.secret=${JWT_SECRET}
jwt.access-token-experation-ms=3600000
jwt.refresh-token-experation-ms=604800000

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email